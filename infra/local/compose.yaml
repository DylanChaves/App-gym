services:
  mysql:
    image: mysql:8.0.43
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: gym_development
      MYSQL_USER: gym_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en el entorno local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el entorno local}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
